name: CPU checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install CPU tools only
        run: |
          python -m pip install uv==0.11.8
          bash scripts/setup.sh
      - name: Syntax and privacy
        run: |
          while IFS= read -r path; do bash -n "$path"; done < <(git ls-files '*.sh' '*.sbatch')
          .venv-tools/bin/python -m compileall -q scripts services tests
          .venv-tools/bin/python scripts/check_release.py
      - name: Unit and protocol tests
        run: |
          node --test tests/unit/*.test.mjs tests/protocol/*.test.mjs
          .venv-tools/bin/python -m unittest discover -s tests/unit
          .venv-tools/bin/python -m unittest discover -s tests/integration
      - name: Browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg
          PLAYWRIGHT_BROWSERS_PATH="$PWD/models/browsers" .venv-tools/bin/python -m playwright install --with-deps chromium
          bash scripts/prepare_test_audio.sh
      - name: Synthetic browser validation (no GPU or model downloads)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/models/browsers
        run: |
          bash scripts/run_browser_tests.sh
          .venv-tools/bin/python tests/browser/presentation.py
          .venv-tools/bin/python tests/browser/demo_timer.py
          .venv-tools/bin/python tests/browser/moshi.py --mock --switch --exercise-reset --output artifacts/browser-moshi-mock
